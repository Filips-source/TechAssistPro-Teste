services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute npm run configurar}
      MYSQL_DATABASE: techassistpro
      MYSQL_USER: techassist
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute npm run configurar}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/techassistpro.sql:/docker-entrypoint-initdb.d/01-techassistpro.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 3001
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: techassistpro
      DB_USER: techassist
      DB_PASS: ${MYSQL_PASSWORD}
      CORS_ORIGENS: http://localhost:3000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  mysql_data:
